version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sahaj-seva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahaj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahaj_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sahaj_seva_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahaj_user} -d ${POSTGRES_DB:-sahaj_seva_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
